<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>og-src — The Beat District</title>
<style>
:root{--wax:#f5ede0;--disp:Georgia,"Iowan Old Style","Palatino Linotype",serif;--body:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:#141009;color:var(--wax);position:relative;
background-image:radial-gradient(820px 520px at 86% -10%,rgba(200,81,47,.30),transparent 60%),radial-gradient(700px 480px at -8% 112%,rgba(79,122,99,.16),transparent 60%)}
.band{position:absolute;inset:0 0 auto 0;height:10px;background:linear-gradient(90deg,#c8512f,#e9a63e 55%,#4f7a63)}
.wrap{position:absolute;inset:70px 70px 64px 70px;display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center}
.label{font:700 20px/1 var(--body);letter-spacing:.3em;text-transform:uppercase;color:#e9a63e;margin-bottom:22px}
h1{font:700 78px/1.05 var(--disp);letter-spacing:-.01em}
h1 em{color:#e06a40;font-style:italic}
.sub{font:600 27px/1.35 var(--body);color:rgba(245,237,224,.85);margin-top:26px}
.line{margin-top:22px;font:700 21px/1.5 var(--body);letter-spacing:.06em;color:rgba(245,237,224,.72)}
svg.art{width:100%;height:auto;display:block}
